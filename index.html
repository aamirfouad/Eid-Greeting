<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<TITLe>"EID ❤"</TITLe>
    <style>
        /* CSS THEME & LAYOUT */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Unikurd Web';
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #022c22 50%, #0c0a09 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding-bottom: 2rem;
        }

        /* TOP ACCENT LINE (WILL ONLY SHOW FOR KURDISH) */
        .flag-accent {
            width: 100%;
            height: 12px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: none; /* Hidden by default */
        }

        /* 1. LANGUAGE SELECTOR SCREEN */
        #langGate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1001;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lang-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2rem;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            max-width: 450px;
            width: 90%;
            backdrop-filter: blur(15px);
        }

        .lang-title {
            font-size: 1.6rem;
            margin-bottom: 2rem;
            color: #fcd34d;
            line-height: 1.6;
        }

        .lang-btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .lang-btn {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-ar {
            background: linear-gradient(135deg, #da251d 0%, #a11812 100%);
            color: white;
        }

        .btn-ku {
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            color: white;
        }

        .lang-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255,255,255,0.1);
        }

        /* 2. NAME GATE SCREEN */
        #nameGate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gate-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 3rem 2rem;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
            backdrop-filter: blur(10px);
        }

        /* FLAGS STYLING */
        .real-iraq-flag, .kurd-flag {
            display: none;
        }

        .real-iraq-flag {
            width: 120px;
            height: auto;
            margin: 0 auto 1.5rem auto;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .kurd-flag {
            width: 100px;
            height: 60px;
            margin: 0 auto 1.5rem auto;
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .flag-red { background: #e11d48; flex: 1; }
        .flag-white { background: #ffffff; flex: 1; display: flex; justify-content: center; align-items: center; position: relative;}
        .flag-green { background: #16a34a; flex: 1; }
        .flag-sun {
            color: #f59e0b;
            font-size: 1.4rem;
            position: absolute;
            line-height: 0;
            animation: spin 12s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* MAIN SURPRISE CONTENT */
        #mainContent {
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            display: none;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 600px;
            text-align: center;
            z-index: 10;
        }

        /* CREATIVE EID CARD */
        .eid-card {
            background: linear-gradient(135deg, rgba(28, 25, 23, 0.4) 0%, rgba(12, 10, 9, 0.6) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2rem;
            border-radius: 24px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7);
            position: relative;
            width: 100%;
        }

        h1 {
            font-size: 2.4rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #f59e0b, #da251d, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        .wishes-text {
            color: #d6d3d1;
            line-height: 2;
            font-size: 1.25rem;
            margin-bottom: 2rem;
        }

        /* EID STICKERS & GIFTS GRID */
        .stickers-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        .sticker {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1rem;
            border-radius: 16px;
            font-size: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            animation: float 4s ease-in-out infinite;
        }

        .sticker:nth-child(2) { animation-delay: 1s; }
        .sticker:nth-child(3) { animation-delay: 2s; }

        .sticker span {
            font-size: 0.85rem;
            color: #f59e0b;
            font-weight: 600;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* STRICT AUDIO ONLY TRICK (TOTAL INVISIBLE OUT OF VIEWPORT) */
        .audio-only-wrapper {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            top: -500px;
            left: -500px;
            opacity: 0.001;
        }

        /* INPUTS & BUTTONS */
        input[type="text"] {
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 1.1rem;
            width: 100%;
            text-align: center;
            outline: none;
            margin-bottom: 1.5rem;
            transition: all 0.3s;
        }

        .action-btn {
            background: linear-gradient(135deg, #da251d 0%, #a11812 100%);
            color: white;
            border: none;
            padding: 0.8rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        /* SLOW FALLING EFFECT */
        .bg-effect {
            position: fixed;
            top: -20px;
            pointer-events: none;
            z-index: 1;
            font-size: 1.5rem;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- خط ألوان علم كوردستان (يظهر فقط في النسخة الكردية عبر الجافا سكريبت) -->
    <div class="flag-accent" id="flagLine"></div>

    <!-- 1. شاشة اختيار اللغة -->
    <div id="langGate">
        <div class="lang-card">
            <h2 class="lang-title">اختر لغتك المفضلة للمعايدة<br>زمانەکەت هەڵبژێرە بۆ پیرۆزباییەکە</h2>
            <div class="lang-btn-container">
                <button class="lang-btn btn-ar" onclick="selectLanguage('ar')">العربية 🇮🇶</button>
                <button class="lang-btn btn-ku" onclick="selectLanguage('ku')">Kurdî ☀️</button>
            </div>
        </div>
    </div>

    <!-- 2. شاشة إدخال الاسم -->
    <div id="nameGate">
        <div class="gate-card">
            <img class="real-iraq-flag active-flag-ar" src="https://cdn.pixabay.com/animation/2022/08/21/20/03/20-03-46-345_512.gif" alt="علم العراق">
            
            <div class="kurd-flag active-flag-ku">
                <div class="flag-red"></div>
                <div class="flag-white"><span class="flag-sun">☀️</span></div>
                <div class="flag-green"></div>
            </div>

            <h2 id="namePromptTitle" style="margin-bottom: 1rem; color: #f59e0b; font-size: 1.5rem;">ما هو اسمك?</h2>
            <input type="text" id="userNameInput" placeholder="..." required autocomplete="off">
            <button class="action-btn" id="gateBtn" onclick="revealCelebration()">عرض التهنئة ✨</button>
        </div>
    </div>

    <!-- 3. بطاقة المعايدة النهائية -->
    <div id="mainContent">
        <div class="eid-card" id="cardContainer">
            <img class="real-iraq-flag active-flag-ar" src="https://cdn.pixabay.com/animation/2022/08/21/20/03/20-03-46-345_512.gif" alt="علم العراق">
            <div class="kurd-flag active-flag-ku">
                <div class="flag-red"></div>
                <div class="flag-white"><span class="flag-sun">☀️</span></div>
                <div class="flag-green"></div>
            </div>
            
            <h1 id="mainTitle">عيد مبارك!</h1>
            
            <p class="wishes-text" id="wishesParagraph"></p>

            <!-- STICKERS GRID -->
            <div class="stickers-container">
                <div class="sticker"><span>🎁</span><span id="stkLabel1">العيدية</span></div>
                <div class="sticker"><span>🐑</span><span id="stkLabel2">الأضحية</span></div>
                <div class="sticker"><span>🍬</span><span id="stkLabel3">الحلوى</span></div>
            </div>
        </div>

        <!-- HIDDEN OUT-OF-SIGHT AUDIO TRICK -->
        <div class="audio-only-wrapper">
            <div id="yt-player"></div>
        </div>
    </div>

    <!-- JAVASCRIPT MASTER ENGINE -->
    <script>
        let currentLang = 'ar';
        let player;
        let targetVideoId = '8qL7r2pEsmU'; // الافتراضي أنشودة عربي تعمل وتدعم الصوت التلقائي

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            loadPlayer(targetVideoId);
        }

        function loadPlayer(vidId) {
            if (player) {
                player.destroy();
            }
            player = new YT.Player('yt-player', {
                height: '1', 
                width: '1',
                videoId: vidId, 
                playerVars: {
                    'playsinline': 1,
                    'loop': 1,
                    'playlist': vidId,
                    'controls': 0
                }
            });
        }

        // 1. اختيار اللغة وضبط واجهة الاستخدام
        function selectLanguage(lang) {
            currentLang = lang;
            document.getElementById('langGate').style.opacity = '0';
            
            if(lang === 'ar') {
                document.dir = 'rtl';
                document.documentElement.lang = 'ar';
                targetVideoId = '8qL7r2pEsmU'; // أنشودة التهنئة الرسمية باللغة العربية
                
                // إخفاء الخط العلوي تماماً للنسخة العربية بناءً على طلبك
                document.getElementById('flagLine').style.display = 'none';
                
                document.getElementById('namePromptTitle').innerText = "ما هو اسمك؟";
                document.getElementById('userNameInput').placeholder = "اكتب اسمك هنا...";
                document.getElementById('gateBtn').innerText = "عرض التهنئة ✨";
                document.getElementById('gateBtn').style.background = "linear-gradient(135deg, #da251d 0%, #a11812 100%)";
                
                document.querySelectorAll('.active-flag-ar').forEach(el => el.style.display = 'block');
                document.querySelectorAll('.active-flag-ku').forEach(el => el.style.display = 'none');
            } else {
                document.dir = 'rtl';
                document.documentElement.lang = 'ku';
                targetVideoId = 'OYtLeHjAAAc'; // الأغنية الكردية
                
                // إظهار خط علم كوردستان العلوي فقط للنسخة الكردية
                document.getElementById('flagLine').style.background = "linear-gradient(to left, #e11d48 33%, #f59e0b 33%, #f59e0b 66%, #16a34a 66%)";
                document.getElementById('flagLine').style.display = 'block';
                
                document.getElementById('namePromptTitle').innerText = "ناوت چییە؟";
                document.getElementById('userNameInput').placeholder = "ناوەکەت لێرە بنووسە...";
                document.getElementById('gateBtn').innerText = "پیرۆزباییەکە ببینە ✨";
                document.getElementById('gateBtn').style.background = "linear-gradient(135deg, #10b981 0%, #047857 100%)";
                
                document.querySelectorAll('.active-flag-ar').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.active-flag-ku').forEach(el => el.style.display = 'flex');
            }

            if (window.YT && window.YT.Player) {
                loadPlayer(targetVideoId);
            }

            setTimeout(() => {
                document.getElementById('langGate').style.display = 'none';
                document.getElementById('nameGate').style.display = 'flex';
            }, 600);
        }

        // 2. تفعيل المعايدة وتشغيل الصوت التلقائي المخفي
        function revealCelebration() {
            const nameInput = document.getElementById('userNameInput').value;
            if (nameInput.trim() === "") {
                if(currentLang === 'ar') alert("يرجى كتابة اسمك أولاً!");
                else alert("تکایە سەرەتا ناوەکەت بنووسە!");
                return;
            }

            const wishesBox = document.getElementById('wishesParagraph');
            
            if(currentLang === 'ar') {
                document.getElementById('mainTitle').innerText = "عيد أضحى مبارك!";
                document.getElementById('stkLabel1').innerText = "العيدية";
                document.getElementById('stkLabel2').innerText = "الأضحية";
                document.getElementById('stkLabel3').innerText = "حلوى العيد";
                
                wishesBox.innerHTML = `أهلاً بك يا <strong style="color: #f59e0b; font-size: 1.4rem;">${nameInput}</strong>،<br>كل عام وأنت بألف خير وصحة وسلامة. أعاد الله عليك وعلى عائلتك الكريمة هذا العيد بالخير واليمن والبركات. أتمنى لك دوام التوفيق وتحقيق الأمنيات وراحة البال، وأن تكون كل أيامك مليئة بالفرح والمسرات في ظلال وطننا الحبيب. عيد سعيد!`;
                document.getElementById('cardContainer').style.border = "1px solid rgba(218, 37, 29, 0.2)";
                document.getElementById('cardContainer').style.background = "linear-gradient(135deg, rgba(28, 25, 23, 0.4) 0%, rgba(12, 10, 9, 0.6) 100%)";
            } else {
                document.getElementById('mainTitle').innerText = "جەژنتان پیرۆز بێت!";
                document.getElementById('stkLabel1').innerText = "دیاری";
                document.getElementById('stkLabel2').innerText = "جەژنی قوربان";
                document.getElementById('stkLabel3').innerText = "شیرینی";
                
                wishesBox.innerHTML = `کاک/خاتوون <strong style="color: #fcd34d; font-size: 1.4rem;">${nameInput}</strong>،<br>گەرمترین و جوانترین پیرۆزبایی جەژنی قوربانت لێبێت. هیوادارم ئەم جەژنە ببێتە مایەی بەدیهاتنی هەموو ئاواتەکانت، تەمەن درێژی و سەرکەوتوویی بۆ خۆت و خێزانە بەڕێزەکەت لە هەر کوێیەک بن. هەمیشە شاد و سەرفراز بن لە سایەی کوردستانی ئازیزماندا.`;
                document.getElementById('cardContainer').style.border = "1px solid rgba(52, 211, 153, 0.2)";
                document.getElementById('cardContainer').style.background = "linear-gradient(135deg, rgba(6, 78, 59, 0.2) 0%, rgba(2, 44, 34, 0.4) 100%)";
            }

            const gate = document.getElementById('nameGate');
            const content = document.getElementById('mainContent');
            
            gate.style.opacity = '0';
            gate.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                gate.style.display = 'none';
                content.style.display = 'flex';
                
                setTimeout(() => {
                    content.style.opacity = '1';
                    content.style.transform = 'scale(1)';
                }, 50);
                
                createAmbientGifts();
                
                // تشغيل الصوت المخفي تماماً بنجاح مستفيداً من ضغطة زر المستخدم
                if (player && typeof player.playVideo === 'function') {
                    player.playVideo();
                }
            }, 600);
        }

        function createAmbientGifts() {
            const symbols = currentLang === 'ar' ? ['✨', '🍀', '🍬', '❤️', '🕋'] : ['✨', '🍀', '🍬', '💛', '☀️', '🕋'];
            setInterval(() => {
                const element = document.createElement('div');
                element.classList.add('bg-effect');
                element.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                element.style.left = Math.random() * 100 + 'vw';
                element.style.animationDuration = Math.random() * 4 + 5 + 's';
                element.style.opacity = Math.random() * 0.5 + 0.2;
                
                document.body.appendChild(element);
                setTimeout(() => { element.remove(); }, 8000);
            }, 400);
        }
    </script>
</body>
</html>
